services:
  - type: web
    name: studio-tracker-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: studio-tracker-web
    runtime: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: studio-tracker-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
